name: software-tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[test,report,app]'
      - run: pytest -q
        env:
          OMP_NUM_THREADS: '2'
      - run: python scripts/verify_notebooks.py
      - run: python scripts/run_demo.py --root /tmp/oncoplate_ci
