[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oncoplate-research"
version = "3.0.0"
description = "Reproducible evidence-bounded multimodal dietary-information research"
requires-python = ">=3.10"
authors = [{name = "Md Anas Biswas"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "PyYAML>=6,<7", "Pillow>=10,<13", "requests>=2.31,<3", "tqdm>=4.66,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1"]
vision = ["torch>=2.5,<3", "torchvision>=0.20,<1", "huggingface-hub>=0.27,<2", "transformers==4.57.1", "accelerate>=1.0,<2", "safetensors>=0.4,<1"]
report = ["matplotlib>=3.8,<4", "tabulate>=0.9,<1"]
export = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2", "onnxscript>=0.2,<1"]
app = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "httpx>=0.27,<1"]

[project.scripts]
oncoplate = "oncoplate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
